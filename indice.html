<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Índice de contenidos</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--a:#4f46e5;--b:#7c3aed}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#151b30;--ink:#e6e9f5;--muted:#94a3b8;--line:#263052}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
.hero{background:linear-gradient(135deg,#1e1b4b,#4f46e5 60%,#7c3aed);color:#fff;padding:clamp(36px,8vw,72px) 20px;text-align:center}
.hero h1{margin:0 0 8px;font-size:clamp(1.7rem,5vw,2.8rem);letter-spacing:-.02em}
.hero p{margin:0;opacity:.8}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px 48px}
.search{margin:-24px auto 26px;max-width:520px}
.search input{width:100%;padding:14px 18px;border:1px solid var(--line);border-radius:14px;font:inherit;background:var(--card);color:var(--ink);box-shadow:0 10px 30px rgba(15,23,42,.15)}
.search input:focus{outline:2px solid var(--a)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(79,70,229,.18);border-color:var(--a)}
a{color:inherit;text-decoration:none}
.main{display:flex;align-items:center;gap:14px;padding:12px}
.ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));flex:none}
.ic svg{width:24px;height:24px}
.t{font-weight:600;word-break:break-word;flex:1}
.go{color:var(--a);font-size:1.3rem;transition:.2s}.card:hover .go{transform:translateX(4px)}
details{padding:0 12px 10px}summary{cursor:pointer;color:var(--muted);font-size:.88rem;padding:6px 0}
details ul{list-style:none;margin:4px 0 0;padding-left:14px;border-left:2px solid var(--line)}
details li{padding:3px 0;font-size:.92rem;word-break:break-word}details li a:hover{color:var(--a);text-decoration:underline}
li.d>a{font-weight:600}li.d>a::before{content:"📁 "}li.f>a::before{content:"📄 "}
.empty{display:none;text-align:center;color:var(--muted);padding:30px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 18px 36px}
</style>
</head>
<body>
<header class="hero"><h1>Índice de contenidos</h1><p>3 elementos · 4 de noviembre de 2026</p></header>
<div class="wrap">
<div class="search"><input id="q" type="search" placeholder="Buscar…" aria-label="Buscar"></div>
<main class="grid">
<article class="card" data-s="examenes totales"><a class="main" href="EXAMENES%20TOTALES/"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="t">EXAMENES TOTALES</span><span class="go">→</span></a></article>
<article class="card" data-s="informatica basica"><a class="main" href="INFORMATICA%20BASICA/"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="t">INFORMATICA BASICA</span><span class="go">→</span></a></article>
<article class="card" data-s="prueba"><a class="main" href="PRUEBA/"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="t">PRUEBA</span><span class="go">→</span></a></article>
</main>
<div class="empty" id="em">No hay resultados</div>
</div>
<footer>Índice generado automáticamente</footer>
<script>
var q=document.getElementById('q'),cs=[].slice.call(document.querySelectorAll('.card')),em=document.getElementById('em');
q.addEventListener('input',function(){var v=q.value.toLowerCase().trim(),n=0;cs.forEach(function(c){var ok=c.getAttribute('data-s').indexOf(v)>-1;c.style.display=ok?'':'none';if(ok)n++});em.style.display=n?'none':'block'});
</script>
</body>
</html>
